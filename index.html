<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>서울시 공공자전거 실시간 지도</title>

    <!-- 반드시 autoload=false 추가 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=e2efaed976f334ed8785e092f6083b8f&autoload=false"></script>

    <style>
      #map {
        width: 100%;
        height: 90vh;
      }
    </style>
  </head>
  <body>
    <h2>🚲 서울시 공공자전거 실시간 대여소 지도</h2>
    <div id="map"></div>

    <script>
      async function loadBikeData() {
        const url =
          "https://openapi.seoul.go.kr:8088/4953546d73676d6131303972534a6549/json/bikeList/1/1000/";

        try {
          const res = await fetch(url);
          const data = await res.json();
          return data.rentBikeStatus.row;
        } catch (err) {
          console.error("데이터 로드 실패:", err);
        }
      }

      async function initMap() {
        const map = new kakao.maps.Map(document.getElementById("map"), {
          center: new kakao.maps.LatLng(37.5665, 126.978),
          level: 5,
        });

        const bikeData = await loadBikeData();

        bikeData.forEach((item) => {
          const lat = item.stationLatitude;
          const lng = item.stationLongitude;
          const name = item.stationName;
          const bikes = Number(item.parkingBikeTotCnt);

          let markerImageUrl =
            bikes === 0
              ? "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
              : bikes >= 5
              ? "https://maps.google.com/mapfiles/ms/icons/green-dot.png"
              : "https://maps.google.com/mapfiles/ms/icons/blue-dot.png";

          const markerImage = new kakao.maps.MarkerImage(
            markerImageUrl,
            new kakao.maps.Size(40, 40)
          );

          const marker = new kakao.maps.Marker({
            map,
            position: new kakao.maps.LatLng(lat, lng),
            image: markerImage,
          });

          const info = new kakao.maps.InfoWindow({
            content: `<div style="padding:5px; font-size:14px;">
              <b>${name}</b><br>
              🚲 이용 가능: ${bikes}대
            </div>`,
          });

          kakao.maps.event.addListener(marker, "click", function () {
            info.open(map, marker);
          });
        });
      }

      // 💥 이 부분이 반드시 필요!
      kakao.maps.load(() => {
        initMap();
      });
    </script>
  </body>
</html>
